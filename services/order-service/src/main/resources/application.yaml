server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service

  datasource:
    url: "${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}"
    username: ${ORDER_DB_USER:order}
    password: ${ORDER_DB_PASSWORD:order-local-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yaml
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodrescue}"

      client:
        provider:
          keycloak:
            token-uri: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/foodrescue/protocol/openid-connect/token}"

        registration:
          offer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            client-id: ${ORDER_SERVICE_CLIENT_ID}
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}

          partner-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            client-id: ${ORDER_SERVICE_CLIENT_ID}
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

food-rescue:
  offer-http:
    base-url: "${OFFER_SERVICE_URL:http://localhost:8083}"
    timeout: ${OFFER_HTTP_TIMEOUT:5000ms}
    oauth2-registration-id: ${OFFER_OAUTH2_REGISTRATION_ID:offer-service}

  partner-http:
    base-url: "${PARTNER_SERVICE_URL:http://localhost:8082}"
    timeout: ${PARTNER_HTTP_TIMEOUT:5000ms}
    oauth2-registration-id: ${PARTNER_OAUTH2_REGISTRATION_ID:partner-service}

  kafka:
    order-commands-topic: ${ORDER_COMMANDS_TOPIC:order.commands.v1}
    offer-events-topic: ${OFFER_EVENTS_TOPIC:offer.events.v1}
    offer-events-consumer-group: ${OFFER_EVENTS_CONSUMER_GROUP:order-service-offer-events-v1}

  outbox:
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${ORDER_OUTBOX_MAX_ATTEMPTS:10}
    fixed-delay: ${ORDER_OUTBOX_FIXED_DELAY:1s}
    initial-delay: ${ORDER_OUTBOX_INITIAL_DELAY:10s}
