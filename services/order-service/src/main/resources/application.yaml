server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service

  datasource:
    url: "${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}"
    username: ${ORDER_DB_USER:order}
    password: ${ORDER_DB_PASSWORD:order-local-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yaml
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodrescue}"

      client:
        provider:
          keycloak:
            token-uri: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/foodrescue/protocol/openid-connect/token}"

        registration:
          offer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            client-id: ${ORDER_SERVICE_CLIENT_ID}
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

food-rescue:
  offer-http:
    base-url: "${OFFER_SERVICE_URL:http://localhost:8083}"
    timeout: ${OFFER_HTTP_TIMEOUT:5000ms}
    oauth2-registration-id: ${OFFER_OAUTH2_REGISTRATION_ID:offer-service}
