server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service

  datasource:
    url: "${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}"
    username: ${ORDER_DB_USER:order}
    password: ${ORDER_DB_PASSWORD:order-local-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yaml
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
