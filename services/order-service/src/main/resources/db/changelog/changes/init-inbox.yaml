databaseChangeLog:
  - changeSet:
      id: order-service-init-inbox
      author: foodrescue
      changes:
        - createTable:
            tableName: inbox_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inbox_events
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - sql:
            sql: >
              ALTER TABLE inbox_events
              ADD CONSTRAINT chk_inbox_events_event_type
              CHECK (length(trim(event_type)) > 0);

      rollback:
        - dropTable:
            tableName: inbox_events
