databaseChangeLog:
  - changeSet:
      id: 001-init-orders
      author: foodrescue
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: offer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: store_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: pickup_start
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: pickup_end
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE orders
              ADD CONSTRAINT chk_orders_quantity_positive CHECK (quantity > 0),
              ADD CONSTRAINT chk_orders_unit_price_non_negative CHECK (unit_price >= 0),
              ADD CONSTRAINT chk_orders_total_amount_non_negative CHECK (total_amount >= 0),
              ADD CONSTRAINT chk_orders_pickup_window CHECK (pickup_end > pickup_start),
              ADD CONSTRAINT chk_orders_status CHECK (
                status IN (
                  'PENDING',
                  'RESERVED',
                  'PICKED_UP',
                  'COMPLETED',
                  'FAILED',
                  'CANCELLED',
                  'NO_SHOW'
                )
              );
      rollback:
        - dropTable:
            tableName: orders
