databaseChangeLog:
  - changeSet:
      id: 002-local-order-test-data
      author: foodrescue
      context: "@local"
      changes:
        - loadData:
            tableName: orders
            file: db/changelog/test-data/orders.csv
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: id
                  name: id
                  type: UUID
              - column:
                  header: customer_id
                  name: customer_id
                  type: STRING
              - column:
                  header: offer_id
                  name: offer_id
                  type: UUID
              - column:
                  header: store_id
                  name: store_id
                  type: UUID
              - column:
                  header: quantity
                  name: quantity
                  type: NUMERIC
              - column:
                  header: unit_price
                  name: unit_price
                  type: NUMERIC
              - column:
                  header: total_amount
                  name: total_amount
                  type: NUMERIC
              - column:
                  header: pickup_start
                  name: pickup_start
                  type: TIMESTAMP
              - column:
                  header: pickup_end
                  name: pickup_end
                  type: TIMESTAMP
              - column:
                  header: status
                  name: status
                  type: STRING
              - column:
                  header: version
                  name: version
                  type: NUMERIC
              - column:
                  header: created_at
                  name: created_at
                  type: TIMESTAMP
              - column:
                  header: updated_at
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - delete:
            tableName: orders
            where: id = '10000000-0000-0000-0000-000000000001'
