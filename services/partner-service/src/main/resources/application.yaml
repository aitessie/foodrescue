server:
  port: 8082

spring:
  application:
    name: partner-service

  datasource:
    url: ${PARTNER_DB_URL:jdbc:postgresql://localhost:5432/partner_db}
    username: ${PARTNER_DB_USER:partner}
    password: ${PARTNER_DB_PASSWORD:partner-local-password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodrescue}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
