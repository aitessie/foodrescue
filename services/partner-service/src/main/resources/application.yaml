server:
  port: ${PARTNER_SERVICE_PORT:8082}

spring:
  application:
    name: partner-service

  datasource:
    url: "${PARTNER_DB_URL:jdbc:postgresql://localhost:5432/partner_db}"
    username: ${PARTNER_DB_USER:partner}
    password: ${PARTNER_DB_PASSWORD:partner-local-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yaml
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodrescue}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

food-rescue:
  kafka:
    partner-events-topic: ${PARTNER_EVENTS_TOPIC:partner.events.v1}

  outbox:
    batch-size: ${PARTNER_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${PARTNER_OUTBOX_MAX_ATTEMPTS:10}
    fixed-delay: ${PARTNER_OUTBOX_FIXED_DELAY:1s}
    initial-delay: ${PARTNER_OUTBOX_INITIAL_DELAY:10s}
