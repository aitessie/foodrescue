databaseChangeLog:
  - changeSet:
      id: offer-service-init-outbox
      author: foodrescue
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: schema_version
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_version
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: NEW
                  constraints:
                    nullable: false

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: last_error
                  type: TEXT

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_event_type
              CHECK (length(trim(event_type)) > 0);

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_schema_version
              CHECK (schema_version > 0);

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_aggregate_version
              CHECK (aggregate_version >= 0);

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_status
              CHECK (status IN ('NEW', 'PUBLISHED', 'FAILED'));

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_attempts
              CHECK (attempts >= 0);

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_events_published_at
              CHECK (
                  (status = 'PUBLISHED' AND published_at IS NOT NULL)
                  OR
                  (status <> 'PUBLISHED' AND published_at IS NULL)
              );

      rollback:
        - dropTable:
            tableName: outbox_events
