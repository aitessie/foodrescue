databaseChangeLog:
  - changeSet:
      id: offer-service-init-offer-reservations
      author: foodrescue
      changes:
        - createTable:
            tableName: offer_reservations
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_offer_reservations
                    nullable: false

              - column:
                  name: offer_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: customer_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: offer_reservations
            baseColumnNames: offer_id
            referencedTableName: offers
            referencedColumnNames: id
            constraintName: fk_offer_reservations_offer
            onDelete: RESTRICT

        - sql:
            sql: >
              ALTER TABLE offer_reservations
              ADD CONSTRAINT chk_offer_reservations_customer
              CHECK (length(trim(customer_id)) > 0);

        - sql:
            sql: >
              ALTER TABLE offer_reservations
              ADD CONSTRAINT chk_offer_reservations_quantity
              CHECK (quantity > 0);

        - sql:
            sql: >
              ALTER TABLE offer_reservations
              ADD CONSTRAINT chk_offer_reservations_status
              CHECK (status IN ('RESERVED', 'RELEASED'));

        - sql:
            sql: >
              ALTER TABLE offer_reservations
              ADD CONSTRAINT chk_offer_reservations_timestamps
              CHECK (updated_at >= created_at);

        - sql:
            sql: >
              ALTER TABLE offer_reservations
              ADD CONSTRAINT chk_offer_reservations_version
              CHECK (version >= 0);

      rollback:
        - dropTable:
            tableName: offer_reservations
