databaseChangeLog:
  - changeSet:
      id: offer-service-dev-test-data
      author: aitessie
      contextFilter: "@local"

      changes:
        - loadData:
            tableName: store_snapshots
            file: db/changelog/test-data/store-snapshots.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: store_id
                  name: store_id
                  type: UUID
              - column:
                  header: partner_id
                  name: partner_id
                  type: UUID
              - column:
                  header: partner_status
                  name: partner_status
                  type: STRING
              - column:
                  header: store_status
                  name: store_status
                  type: STRING
              - column:
                  header: name
                  name: name
                  type: STRING
              - column:
                  header: address
                  name: address
                  type: STRING
              - column:
                  header: time_zone
                  name: time_zone
                  type: STRING
              - column:
                  header: store_version
                  name: store_version
                  type: NUMERIC
              - column:
                  header: partner_version
                  name: partner_version
                  type: NUMERIC

        - loadData:
            tableName: food_bags
            file: db/changelog/test-data/food-bags.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: id
                  name: id
                  type: UUID
              - column:
                  header: store_id
                  name: store_id
                  type: UUID
              - column:
                  header: name
                  name: name
                  type: STRING
              - column:
                  header: description
                  name: description
                  type: STRING
              - column:
                  header: category
                  name: category
                  type: STRING
              - column:
                  header: original_price_minor
                  name: original_price_minor
                  type: NUMERIC
              - column:
                  header: unit_price_minor
                  name: unit_price_minor
                  type: NUMERIC
              - column:
                  header: currency
                  name: currency
                  type: STRING
              - column:
                  header: status
                  name: status
                  type: STRING
              - column:
                  header: created_at
                  name: created_at
                  type: TIMESTAMP
              - column:
                  header: updated_at
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  header: version
                  name: version
                  type: NUMERIC

        - loadData:
            tableName: food_bag_allergens
            file: db/changelog/test-data/food-bag-allergens.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: food_bag_id
                  name: food_bag_id
                  type: UUID
              - column:
                  header: allergen
                  name: allergen
                  type: STRING

        - loadData:
            tableName: offers
            file: db/changelog/test-data/offers.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: id
                  name: id
                  type: UUID
              - column:
                  header: store_id
                  name: store_id
                  type: UUID
              - column:
                  header: food_bag_id
                  name: food_bag_id
                  type: UUID
              - column:
                  header: category
                  name: category
                  type: STRING
              - column:
                  header: unit_price_minor
                  name: unit_price_minor
                  type: NUMERIC
              - column:
                  header: currency
                  name: currency
                  type: STRING
              - column:
                  header: status
                  name: status
                  type: STRING
              - column:
                  header: total_quantity
                  name: total_quantity
                  type: NUMERIC
              - column:
                  header: available_quantity
                  name: available_quantity
                  type: NUMERIC
              - column:
                  header: pickup_start
                  name: pickup_start
                  type: TIMESTAMP
              - column:
                  header: pickup_end
                  name: pickup_end
                  type: TIMESTAMP
              - column:
                  header: created_at
                  name: created_at
                  type: TIMESTAMP
              - column:
                  header: updated_at
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  header: version
                  name: version
                  type: NUMERIC

        - loadData:
            tableName: offer_allergens
            file: db/changelog/test-data/offer-allergens.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: offer_id
                  name: offer_id
                  type: UUID
              - column:
                  header: allergen
                  name: allergen
                  type: STRING

        - loadData:
            tableName: offer_reservations
            file: db/changelog/test-data/offer-reservations.csv
            encoding: UTF-8
            separator: ","
            quotchar: '"'
            columns:
              - column:
                  header: id
                  name: id
                  type: UUID
              - column:
                  header: offer_id
                  name: offer_id
                  type: UUID
              - column:
                  header: customer_id
                  name: customer_id
                  type: STRING
              - column:
                  header: quantity
                  name: quantity
                  type: NUMERIC
              - column:
                  header: status
                  name: status
                  type: STRING
              - column:
                  header: created_at
                  name: created_at
                  type: TIMESTAMP
              - column:
                  header: updated_at
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  header: version
                  name: version
                  type: NUMERIC

      rollback:
        - delete:
            tableName: offer_reservations
            where: >
              id IN (
                  '50000000-0000-0000-0000-000000000001',
                  '50000000-0000-0000-0000-000000000002'
              )

        - delete:
            tableName: offer_allergens
            where: >
              offer_id IN (
                  '40000000-0000-0000-0000-000000000001',
                  '40000000-0000-0000-0000-000000000002',
                  '40000000-0000-0000-0000-000000000003',
                  '40000000-0000-0000-0000-000000000004',
                  '40000000-0000-0000-0000-000000000005',
                  '40000000-0000-0000-0000-000000000006',
                  '40000000-0000-0000-0000-000000000007'
              )

        - delete:
            tableName: offers
            where: >
              id IN (
                  '40000000-0000-0000-0000-000000000001',
                  '40000000-0000-0000-0000-000000000002',
                  '40000000-0000-0000-0000-000000000003',
                  '40000000-0000-0000-0000-000000000004',
                  '40000000-0000-0000-0000-000000000005',
                  '40000000-0000-0000-0000-000000000006',
                  '40000000-0000-0000-0000-000000000007'
              )

        - delete:
            tableName: food_bag_allergens
            where: >
              food_bag_id IN (
                  '30000000-0000-0000-0000-000000000001',
                  '30000000-0000-0000-0000-000000000002',
                  '30000000-0000-0000-0000-000000000003',
                  '30000000-0000-0000-0000-000000000004'
              )

        - delete:
            tableName: food_bags
            where: >
              id IN (
                  '30000000-0000-0000-0000-000000000001',
                  '30000000-0000-0000-0000-000000000002',
                  '30000000-0000-0000-0000-000000000003',
                  '30000000-0000-0000-0000-000000000004'
              )

        - delete:
            tableName: store_snapshots
            where: >
              store_id IN (
                  '20000000-0000-0000-0000-000000000001',
                  '20000000-0000-0000-0000-000000000002',
                  '20000000-0000-0000-0000-000000000003'
              )
