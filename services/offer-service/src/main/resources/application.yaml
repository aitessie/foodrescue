server:
  port: ${OFFER_SERVICE_PORT:8083}

spring:
  application:
    name: offer-service

  datasource:
    url: "${OFFER_DB_URL:jdbc:postgresql://localhost:5432/offer_db}"
    username: ${OFFER_DB_USER:offer}
    password: ${OFFER_DB_PASSWORD:offer-local-password}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yaml
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${OFFER_KAFKA_CONSUMER_GROUP:offer-service-store-read-model-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodrescue}"

      client:
        provider:
          keycloak:
            token-uri: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/foodrescue/protocol/openid-connect/token}"

        registration:
          offer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            client-id: ${OFFER_SERVICE_CLIENT_ID:offer-service}
            client-secret: ${OFFER_SERVICE_CLIENT_SECRET}

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

food-rescue:
  partner-http:
    base-url: "${PARTNER_SERVICE_URL:http://localhost:8082}"
    timeout: ${PARTNER_HTTP_TIMEOUT:500ms}
    oauth2-registration-id: offer-service

  kafka:
    partner-events-topic: ${PARTNER_EVENTS_TOPIC:partner.events.v1}
    partner-events-dlt-topic: ${PARTNER_EVENTS_DLT_TOPIC:partner.events.v1.DLT}
    offer-events-topic: ${OFFER_EVENTS_TOPIC:offer.events.v1}

  scheduler:
    close-expired-enabled: ${CLOSE_EXPIRED_OFFERS_ENABLED:true}
    close-expired-initial-delay: ${CLOSE_EXPIRED_OFFERS_INITIAL_DELAY:30s}
    close-expired-fixed-delay: ${CLOSE_EXPIRED_OFFERS_FIXED_DELAY:60s}
    close-expired-batch-size: ${CLOSE_EXPIRED_OFFERS_BATCH_SIZE:100}

  search:
    default-limit: ${OFFER_SEARCH_DEFAULT_LIMIT:20}
    min-limit: ${OFFER_SEARCH_MIN_LIMIT:1}
    max-limit: ${OFFER_SEARCH_MAX_LIMIT:100}
    max-radius-meters: ${OFFER_SEARCH_MAX_RADIUS_METERS:100000}
