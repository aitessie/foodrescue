name: foodrescue

services:
  partner-postgres:
    image: postgres:17-alpine
    container_name: foodrescue-partner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PARTNER_DB_NAME}
      POSTGRES_USER: ${PARTNER_DB_USER}
      POSTGRES_PASSWORD: ${PARTNER_DB_PASSWORD}
    ports:
      - "${PARTNER_DB_PORT}:5432"
    volumes:
      - partner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PARTNER_DB_USER} -d ${PARTNER_DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: foodrescue-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    container_name: foodrescue-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: foodrescue-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_HEALTH_ENABLED: "true"

      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT}:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

volumes:
  partner-postgres-data:
  keycloak-postgres-data:
